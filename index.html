<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わたしのノート</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Kaisei+Decol:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdf6ee;
      --bg2: #fff9f2;
      --card: #ffffff;
      --text: #3d2e1e;
      --text-soft: #7a6555;
      --accent: #e07b54;
      --accent-light: #fbe8df;
      --green: #5a9e7c;
      --green-light: #dff0e8;
      --blue: #5e8fc0;
      --blue-light: #ddeaf7;
      --purple: #9070c0;
      --purple-light: #ede5f7;
      --yellow: #c8922a;
      --yellow-light: #fef3dc;
      --border: #e8ddd0;
      --shadow: 0 2px 16px rgba(100,70,40,0.09);
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.75;
    }

    /* ── HEADER ── */
    header {
      background: var(--bg2);
      border-bottom: 2px solid var(--border);
      padding: 1.5rem 2rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header .logo { font-family: 'Kaisei Decol', serif; font-size: 1.6rem; color: var(--accent); letter-spacing: 0.04em; }
    header .subtitle { font-size: 0.8rem; color: var(--text-soft); margin-top: 0.15rem; }

    /* ── LAYOUT ── */
    .container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* ── ADD BUTTON ── */
    .add-btn {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--accent); color: #fff;
      border: none; border-radius: 99px;
      padding: 0.65rem 1.4rem; font-size: 0.95rem;
      font-family: inherit; cursor: pointer;
      box-shadow: 0 3px 12px rgba(224,123,84,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-bottom: 1.8rem;
    }
    .add-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(224,123,84,0.4); }
    .add-btn svg { flex-shrink: 0; }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(61,46,30,0.45); z-index: 100;
      align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); border-radius: var(--radius);
      padding: 2rem; width: 100%; max-width: 520px;
      box-shadow: 0 8px 40px rgba(100,70,40,0.18);
      animation: popIn 0.2s ease;
    }
    @keyframes popIn { from { opacity:0; transform:scale(0.93) } to { opacity:1; transform:scale(1) } }
    .modal h2 { font-family: 'Kaisei Decol', serif; font-size: 1.2rem; margin-bottom: 1.2rem; color: var(--accent); }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-soft); margin-bottom: 0.35rem; letter-spacing: 0.04em; }
    .form-group input[type="text"],
    .form-group textarea,
    .form-group select {
      width: 100%; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 0.6rem 0.8rem;
      font-family: inherit; font-size: 0.95rem; color: var(--text);
      background: var(--bg); transition: border-color 0.15s;
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { outline: none; border-color: var(--accent); }
    .form-group textarea { min-height: 100px; }

    .modal-actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.4rem; }
    .btn-cancel {
      background: none; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 0.5rem 1.1rem;
      font-family: inherit; font-size: 0.9rem; cursor: pointer;
      color: var(--text-soft); transition: background 0.15s;
    }
    .btn-cancel:hover { background: var(--border); }
    .btn-save {
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px;
      padding: 0.5rem 1.3rem; font-family: inherit;
      font-size: 0.9rem; cursor: pointer;
      box-shadow: 0 2px 8px rgba(224,123,84,0.3);
      transition: transform 0.15s;
    }
    .btn-save:hover { transform: translateY(-1px); }

    /* ── FILTERS ── */
    .filters {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .filter-btn {
      border: 1.5px solid var(--border);
      border-radius: 99px; padding: 0.35rem 0.9rem;
      font-family: inherit; font-size: 0.82rem;
      background: var(--card); color: var(--text-soft);
      cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active,
    .filter-btn:hover { border-color: currentColor; }
    .filter-btn[data-cat="all"].active { background: var(--text); color: #fff; border-color: var(--text); }
    .filter-btn[data-cat="体・健康管理"].active { background: var(--green-light); color: var(--green); border-color: var(--green); }
    .filter-btn[data-cat="メンタル・気分"].active { background: var(--blue-light); color: var(--blue); border-color: var(--blue); }
    .filter-btn[data-cat="人間関係"].active { background: var(--purple-light); color: var(--purple); border-color: var(--purple); }
    .filter-btn[data-cat="その他・自由メモ"].active { background: var(--yellow-light); color: var(--yellow); border-color: var(--yellow); }

    /* ── SEARCH ── */
    .search-wrap { position: relative; margin-bottom: 1.5rem; }
    .search-wrap input {
      width: 100%; border: 1.5px solid var(--border);
      border-radius: 99px; padding: 0.55rem 1rem 0.55rem 2.4rem;
      font-family: inherit; font-size: 0.9rem; background: var(--card);
      color: var(--text); transition: border-color 0.15s;
    }
    .search-wrap input:focus { outline: none; border-color: var(--accent); }
    .search-wrap .search-icon {
      position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%);
      color: var(--text-soft); pointer-events: none;
    }

    /* ── CARDS ── */
    .cards { display: grid; gap: 1rem; }
    .card {
      background: var(--card); border-radius: var(--radius);
      padding: 1.2rem 1.4rem; box-shadow: var(--shadow);
      border-left: 4px solid var(--border);
      animation: fadeUp 0.25s ease both;
      position: relative;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
    .card[data-cat="体・健康管理"] { border-left-color: var(--green); }
    .card[data-cat="メンタル・気分"] { border-left-color: var(--blue); }
    .card[data-cat="人間関係"] { border-left-color: var(--purple); }
    .card[data-cat="その他・自由メモ"] { border-left-color: var(--yellow); }

    .card-meta {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 0.5rem; flex-wrap: wrap;
    }
    .card-cat {
      font-size: 0.72rem; font-weight: 500; padding: 0.15rem 0.6rem;
      border-radius: 99px; letter-spacing: 0.04em;
    }
    .card[data-cat="体・健康管理"] .card-cat { background: var(--green-light); color: var(--green); }
    .card[data-cat="メンタル・気分"] .card-cat { background: var(--blue-light); color: var(--blue); }
    .card[data-cat="人間関係"] .card-cat { background: var(--purple-light); color: var(--purple); }
    .card[data-cat="その他・自由メモ"] .card-cat { background: var(--yellow-light); color: var(--yellow); }

    .card-date { font-size: 0.75rem; color: var(--text-soft); }
    .card-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.3rem; }
    .card-body { font-size: 0.9rem; color: var(--text-soft); white-space: pre-wrap; }

    .card-actions {
      position: absolute; top: 0.9rem; right: 1rem;
      display: flex; gap: 0.3rem; opacity: 0; transition: opacity 0.15s;
    }
    .card:hover .card-actions { opacity: 1; }
    .card-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-soft); padding: 0.2rem;
      border-radius: 4px; transition: color 0.15s, background 0.15s;
      font-size: 0.8rem;
    }
    .card-btn:hover { background: var(--bg); color: var(--text); }
    .card-btn.del:hover { color: #e05454; }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center; padding: 3rem 1rem;
      color: var(--text-soft); display: none;
    }
    .empty.show { display: block; }
    .empty .emoji { font-size: 2.5rem; margin-bottom: 0.8rem; }

    /* ── COUNT ── */
    .count-line { font-size: 0.8rem; color: var(--text-soft); margin-bottom: 0.8rem; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">📓 わたしのノート</div>
    <div class="subtitle">経験から学んだこと、気分がよくなること、なんでも</div>
  </div>
</header>

<div class="container">

  <button class="add-btn" onclick="openModal()">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    新しいメモを追加
  </button>

  <div class="search-wrap">
    <span class="search-icon">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <input type="text" id="searchInput" placeholder="メモを検索…" oninput="render()">
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all" onclick="setFilter('all')">すべて</button>
    <button class="filter-btn" data-cat="体・健康管理" onclick="setFilter('体・健康管理')">💪 体・健康管理</button>
    <button class="filter-btn" data-cat="メンタル・気分" onclick="setFilter('メンタル・気分')">🌤 メンタル・気分</button>
    <button class="filter-btn" data-cat="人間関係" onclick="setFilter('人間関係')">🤝 人間関係</button>
    <button class="filter-btn" data-cat="その他・自由メモ" onclick="setFilter('その他・自由メモ')">✏️ その他・自由メモ</button>
  </div>

  <div class="count-line" id="countLine"></div>
  <div class="cards" id="cards"></div>
  <div class="empty" id="empty">
    <div class="emoji">📭</div>
    <p>メモがありません</p>
  </div>

</div>

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="overlayClick(event)">
  <div class="modal">
    <h2 id="modalTitle">新しいメモ</h2>
    <div class="form-group">
      <label>カテゴリ</label>
      <select id="fCat">
        <option>体・健康管理</option>
        <option>メンタル・気分</option>
        <option>人間関係</option>
        <option>その他・自由メモ</option>
      </select>
    </div>
    <div class="form-group">
      <label>タイトル（一言で）</label>
      <input type="text" id="fTitle" placeholder="例：朝はたんぱく質多めにすると眠くなりにくい">
    </div>
    <div class="form-group">
      <label>詳しく（任意）</label>
      <textarea id="fBody" placeholder="気づいたきっかけや、どんなときに使えるかなど…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="save()">保存する</button>
    </div>
  </div>
</div>

<script>
  let notes = [];
  let currentFilter = 'all';
  let editingId = null;

  function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

  // ── データ読み込み（サーバーAPIまたはlocalStorageフォールバック）──
  async function loadNotes() {
    try {
      const res = await fetch('/api/notes');
      if (!res.ok) throw new Error();
      notes = await res.json();
    } catch {
      notes = JSON.parse(localStorage.getItem('mynotebook_v1') || '[]');
    }
    render();
  }

  async function persist() {
    try {
      await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(notes),
      });
    } catch {
      localStorage.setItem('mynotebook_v1', JSON.stringify(notes));
    }
  }

  function setFilter(cat) {
    currentFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
    render();
  }

  function render() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let list = notes.filter(n => currentFilter === 'all' || n.cat === currentFilter);
    if (q) list = list.filter(n => n.title.toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q));
    list = list.slice().reverse();

    const container = document.getElementById('cards');
    const empty = document.getElementById('empty');
    const countLine = document.getElementById('countLine');

    container.innerHTML = '';
    if (list.length === 0) {
      empty.classList.add('show');
      countLine.textContent = '';
      return;
    }
    empty.classList.remove('show');
    countLine.textContent = `${list.length} 件`;

    list.forEach(n => {
      const d = new Date(n.date);
      const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
      const div = document.createElement('div');
      div.className = 'card';
      div.dataset.cat = n.cat;
      div.innerHTML = `
        <div class="card-meta">
          <span class="card-cat">${n.cat}</span>
          <span class="card-date">${dateStr}</span>
        </div>
        <div class="card-title">${escHtml(n.title)}</div>
        ${n.body ? `<div class="card-body">${escHtml(n.body)}</div>` : ''}
        <div class="card-actions">
          <button class="card-btn" onclick="editNote('${n.id}')" title="編集">✏️</button>
          <button class="card-btn del" onclick="deleteNote('${n.id}')" title="削除">🗑</button>
        </div>`;
      container.appendChild(div);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function openModal(id) {
    editingId = id || null;
    const n = id ? notes.find(x => x.id === id) : null;
    document.getElementById('modalTitle').textContent = id ? 'メモを編集' : '新しいメモ';
    document.getElementById('fCat').value = n ? n.cat : '体・健康管理';
    document.getElementById('fTitle').value = n ? n.title : '';
    document.getElementById('fBody').value = n ? (n.body || '') : '';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('fTitle').focus(), 50);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
  }

  function overlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  async function save() {
    const title = document.getElementById('fTitle').value.trim();
    if (!title) { document.getElementById('fTitle').focus(); return; }
    const cat = document.getElementById('fCat').value;
    const body = document.getElementById('fBody').value.trim();

    if (editingId) {
      const i = notes.findIndex(n => n.id === editingId);
      if (i !== -1) { notes[i].cat = cat; notes[i].title = title; notes[i].body = body; }
    } else {
      notes.push({ id: genId(), cat, title, body, date: Date.now() });
    }
    await persist();
    closeModal();
    render();
  }

  function editNote(id) { openModal(id); }

  async function deleteNote(id) {
    if (!confirm('このメモを削除しますか？')) return;
    notes = notes.filter(n => n.id !== id);
    await persist();
    render();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      if (document.getElementById('modalOverlay').classList.contains('open')) save();
    }
  });

  loadNotes();
</script>
</body>
</html>
